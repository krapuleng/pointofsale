# AUTHORED WITHOUT A WINDOWS TEST RUN.
#
# PURPOSE
#   java.util.logging configuration for the Windows shortcuts. Those shortcuts
#   launch javaw.exe, which has no console, so without this file every message
#   the application logs - "Cannot run Derby Server", "Cannot set look and
#   feel", configuration and JDBC failures - is discarded silently.
#
# THIS FILE IS THE FALLBACK, NOT THE ONE NORMALLY USED
#   A .properties file cannot resolve %LOCALAPPDATA%. The nearest it can get is
#   %h, java.util.logging's expansion of the JVM's user.home - and that is a
#   DIFFERENT value on any machine whose Local AppData is redirected or roaming,
#   which would send FileHandler to a directory nobody created. So install.cmd
#   writes a copy of this file with the real, resolved directory in it, to
#   %LOCALAPPDATA%\BIZAPP POS\logging.properties, and points
#   -Djava.util.logging.config.file at that copy. This file is used only if that
#   copy could not be written; install.cmd then also creates the %h-derived
#   directory below so that even the fallback has somewhere to write.
#
#   THE INSTALLER IS THE ONLY WRITER. run.cmd deliberately does NOT generate
#   this file: it selects the installed copy when it exists and falls back to
#   this one when it does not. Do not re-add a generating block to run.cmd. A
#   batch file cannot emit the \uXXXX escapes that a non-ASCII profile such as
#   C:\Users\Muller needs, and because run.cmd would overwrite the installer's
#   correct copy, one run of it would silently disable logging for the Start
#   Menu shortcuts too - which is exactly the log you need when a javaw
#   shortcut fails with no window.
#   Any change here belongs in Write-BizappLoggingConfig in
#   install\windows\lib\Install-BizappPos.ps1 as well - those two only.
#
# TRAP 1 - BACKSLASHES
#   In a .properties file a backslash is an escape character.
#   C:\Users\Bob\logs\x.log parses as C:UsersBoblogsx.log.
#   Every path below therefore uses forward slashes. Java accepts them on
#   Windows. Do not "fix" them to backslashes.
#
# TRAP 2 - THE DIRECTORY MUST ALREADY EXIST
#   FileHandler does not create parent directories. If the folder is missing it
#   throws NoSuchFileException while creating its .lck file and the application
#   logs nothing at all.
#
# TRAP 3 - %g IS NOT OPTIONAL
#   Omitting %g from the pattern makes FileHandler append its own generation
#   suffix, producing files named bizapp-0.log.0 instead of bizapp-0.log.
#
# %h expands to the user's home directory (C:\Users\<name>), so the pattern
# below resolves to C:\Users\<name>\AppData\Local\BIZAPP POS\logs\bizapp-0.log.

handlers=java.util.logging.FileHandler
.level=INFO

java.util.logging.FileHandler.pattern=%h/AppData/Local/BIZAPP POS/logs/bizapp-%g.log
java.util.logging.FileHandler.limit=2097152
java.util.logging.FileHandler.count=5
java.util.logging.FileHandler.append=true
java.util.logging.FileHandler.formatter=java.util.logging.SimpleFormatter
